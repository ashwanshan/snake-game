<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="game-container">

        <div class="header">

            <h1>Snake Game</h1>

        </div>


        <div id="game-board"></div>


        <div class="controls">

            <button data-direction="UP">⬆</button>

            <div>
                <button type="button" class="control-btn" data-direction="LEFT">←</button>
                <button type="button" class="control-btn" data-direction="DOWN">↓</button>
                <button type="button" class="control-btn" data-direction="RIGHT">→</button>
            </div>

        </div>


        <div id="game-over" class="hidden">

            <h2>Game Over</h2>

            <button id="restart">
                Restart
            </button>

        </div>

    </div>


    <script type="module" src="./js/main.js"></script>

</body>

</html>
